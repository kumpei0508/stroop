<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Stroop and Reverse Stroop Task</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet">

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    #jspsych-target {
      width: 100vw;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .task-container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      text-align: center;
      padding: 10px;
      box-sizing: border-box;
    }

    .stimulus {
      font-size: clamp(60px, 14vw, 110px);
      font-weight: bold;
      margin: 30px auto;
      line-height: 1.2;
      text-align: center;
    }

    .patch {
      width: clamp(110px, 28vw, 180px);
      height: clamp(110px, 28vw, 180px);
      margin: 35px auto;
      border: 3px solid #333;
      border-radius: 8px;
    }

    .task-text {
      font-size: clamp(20px, 5vw, 30px);
      line-height: 1.5;
      margin-bottom: 22px;
      text-align: center;
    }

    .button-area {
      display: flex;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .color-btn {
      font-size: clamp(16px, 4vw, 24px);
      font-weight: bold;
      padding: 12px 14px;
      min-width: clamp(52px, 16vw, 90px);
      min-height: clamp(52px, 12vw, 70px);
      border-radius: 12px;
      border: 3px solid #222;
      cursor: pointer;
      background: #f5f5f5;
      color: #111;
      touch-action: manipulation;
    }

    .start-btn,
    .jspsych-btn,
    .download-btn {
      font-size: clamp(22px, 5vw, 32px) !important;
      font-weight: bold !important;
      padding: 18px 34px !important;
      border-radius: 14px !important;
      border: 3px solid #222 !important;
      background: #f5f5f5 !important;
      color: #111 !important;
      min-width: 180px !important;
      min-height: 70px !important;
      margin-top: 20px !important;
      cursor: pointer;
    }

    .correct-feedback {
      background: #00c853 !important;
      color: white !important;
      border-color: #007a33 !important;
    }

    .incorrect-feedback {
      background: #d50000 !important;
      color: white !important;
      border-color: #8b0000 !important;
    }

    .instruction {
      font-size: clamp(22px, 5vw, 30px);
      line-height: 1.7;
      text-align: center;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      box-sizing: border-box;
    }

    .instruction h2 {
      font-size: clamp(30px, 7vw, 42px);
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body></body>

<script>

const TASK_TIME = 30000;
const PRACTICE_TRIALS = 5;

const colors = [
  {name:"赤", css:"red"},
  {name:"青", css:"blue"},
  {name:"緑", css:"green"},
  {name:"黄", css:"gold"},
  {name:"紫", css:"purple"}
];

let allResponses = [];
let practiceResponses = [];
let currentTask = null;
let currentStimulus = null;
let stimulusStartTime = null;
let acceptingResponse = true;
let practiceTrialNumber = 0;

const jsPsych = initJsPsych({
  on_finish: function() {
    showResults();
  }
});

function makeButtons() {
  return `
    <div class="button-area">
      ${colors.map(c =>
        `<button class="color-btn" onclick="recordResponse('${c.name}', this)">${c.name}</button>`
      ).join("")}
    </div>
  `;
}

function resetButtonFeedback() {
  document.querySelectorAll(".color-btn").forEach(btn => {
    btn.classList.remove("correct-feedback");
    btn.classList.remove("incorrect-feedback");
  });
}

function randomChoice(array) {
  return array[Math.floor(Math.random() * array.length)];
}

function makeConflictStimuli(answerBy) {
  const arr = [];
  for (const word of colors) {
    for (const ink of colors) {
      if (word.name !== ink.name) {
        arr.push({
          word: word.name,
          ink: ink.name,
          ink_css: ink.css,
          correct: answerBy === "word" ? word.name : ink.name
        });
      }
    }
  }
  return arr;
}

const task1Stimuli = colors.map(c => ({
  word: c.name,
  ink: "黒",
  ink_css: "black",
  correct: c.name
}));

const task2Stimuli = makeConflictStimuli("word");

const task3Stimuli = colors.map(c => ({
  word: c.name,
  ink: c.name,
  ink_css: c.css,
  correct: c.name
}));

const task4Stimuli = makeConflictStimuli("ink");

function showNextStimulus() {
  resetButtonFeedback();

  acceptingResponse = true;
  currentStimulus = randomChoice(currentTask.stimuli);
  stimulusStartTime = performance.now();

  let html = "";
  const practiceLabel = currentTask.isPractice
    ? `<div class="task-text"><b>練習 ${practiceTrialNumber + 1} / ${PRACTICE_TRIALS}</b></div>`
    : "";

  if (currentTask.mode === "task1") {
    html = `
      ${practiceLabel}
      <div class="stimulus" style="color:black;">${currentStimulus.word}</div>
      <div class="task-text">黒のインクで表示される<b>文字の意味</b>に対応するボタンを押してください。</div>
    `;
  }

  if (currentTask.mode === "task2") {
    html = `
      ${practiceLabel}
      <div class="stimulus" style="color:${currentStimulus.ink_css};">${currentStimulus.word}</div>
      <div class="task-text">文字のインクの色に惑わされず、<b>文字の意味</b>に対応するボタンを押してください。</div>
    `;
  }

  if (currentTask.mode === "task3") {
    html = `
      ${practiceLabel}
      <div class="stimulus" style="color:${currentStimulus.ink_css};">${currentStimulus.word}</div>
      <div class="task-text">文字の<b>インクの色</b>に対応するボタンを押してください。</div>
    `;
  }

  if (currentTask.mode === "task4") {
    html = `
      ${practiceLabel}
      <div class="stimulus" style="color:${currentStimulus.ink_css};">${currentStimulus.word}</div>
      <div class="task-text">文字の意味に惑わされず、文字の<b>インクの色</b>に対応するボタンを押してください。</div>
    `;
  }

  document.getElementById("stimulus-area").innerHTML = html;
}

window.recordResponse = function(response, buttonElement) {
  if (!acceptingResponse) return;
  acceptingResponse = false;

  const rt = Math.round(performance.now() - stimulusStartTime);
  const correct = response === currentStimulus.correct;

  const record = {
    phase: currentTask.isPractice ? "practice" : "main",
    task: currentTask.name,
    task_label: currentTask.title,
    response: response,
    correct_response: currentStimulus.correct,
    correct: correct,
    rt: rt,
    stimulus_word: currentStimulus.word || "",
    stimulus_ink: currentStimulus.ink || "",
    stimulus_ink_css: currentStimulus.ink_css || "",
    stimulus: JSON.stringify(currentStimulus)
  };

  if (currentTask.isPractice) {
    practiceResponses.push(record);
  } else {
    allResponses.push(record);
  }

  if (correct) {
    buttonElement.classList.add("correct-feedback");
  } else {
    buttonElement.classList.add("incorrect-feedback");
  }

  setTimeout(function() {

    const stim = document.querySelector(".stimulus");
    if (stim) stim.style.visibility = "hidden";

    const patch = document.querySelector(".patch");
    if (patch) patch.style.visibility = "hidden";

    resetButtonFeedback();

    setTimeout(function() {
      if (currentTask.isPractice) {
        practiceTrialNumber++;
        if (practiceTrialNumber >= PRACTICE_TRIALS) {
          jsPsych.finishTrial();
        } else {
          showNextStimulus();
        }
      } else {
        showNextStimulus();
      }
    }, 100);

  }, 180);
};

function makeTask(name, title, instruction, mode, stimuli) {
  return {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <div class="task-container">
        <div id="stimulus-area"></div>
        ${makeButtons()}
      </div>
    `,
    choices: "NO_KEYS",
    trial_duration: TASK_TIME,
    on_load: function() {
      currentTask = {name, title, mode, stimuli, isPractice: false};
      showNextStimulus();
    }
  };
}

function makePracticeTask(name, title, instruction, mode, stimuli) {
  return {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <div class="task-container">
        <div id="stimulus-area"></div>
        ${makeButtons()}
      </div>
    `,
    choices: "NO_KEYS",
    on_load: function() {
      currentTask = {name: name + "_practice", title: title + " 練習", mode, stimuli, isPractice: true};
      practiceTrialNumber = 0;
      showNextStimulus();
    }
  };
}

function makeTaskInstruction(title, instruction, isPractice=false) {
  return {
    type: jsPsychHtmlButtonResponse,
    stimulus: `
      <div class="instruction">
        <h2>${title}</h2>
        <p>${instruction}</p>
        ${isPractice ? `<p>これから練習を${PRACTICE_TRIALS}試行行います。</p>` : `<p>制限時間は30秒です。</p>`}
        <p>準備ができたら「開始」を押してください。</p>
      </div>
    `,
    choices: ["開始"],
    button_html: '<button class="start-btn">%choice%</button>'
  };
}

const startInstruction = {
  type: jsPsychHtmlButtonResponse,
  stimulus: `
    <div class="instruction">
      <p>これから4種類の課題を行います。</p>
      <p>各課題の前に練習を5試行行います。</p>
      <p>本番の各課題は30秒間です。</p>
      <p>画面下のボタンをタップして回答してください。</p>
      <p>できるだけ速く、正確に回答してください。</p>
      <p>準備ができたら「開始」を押してください。</p>
    </div>
  `,
  choices: ["開始"],
  button_html: '<button class="start-btn">%choice%</button>'
};

function getSummaryRows() {
  function count(task, correctOnly=false) {
    return allResponses.filter(r =>
      r.task === task && (!correctOnly || r.correct)
    ).length;
  }

  function meanRt(task, correctOnly=true) {
    const rows = allResponses.filter(r =>
      r.task === task && (!correctOnly || r.correct)
    );
    if (rows.length === 0) return "";
    return Math.round(rows.reduce((sum, r) => sum + r.rt, 0) / rows.length);
  }

  const taskNames = [
    ["task1_reverse_control", "Task 1", "逆ストループ統制課題"],
    ["task2_reverse_interference", "Task 2", "逆ストループ干渉課題"],
    ["task3_stroop_control", "Task 3", "ストループ統制課題"],
    ["task4_stroop_interference", "Task 4", "ストループ干渉課題"]
  ];

  const rows = taskNames.map(([task, taskNo, label]) => {
    const total = count(task);
    const correct = count(task, true);
    return {
      task: taskNo,
      task_name: label,
      total_responses: total,
      correct_responses: correct,
      accuracy_percent: total > 0 ? Math.round((correct / total) * 1000) / 10 : "",
      mean_rt_correct_ms: meanRt(task, true)
    };
  });

  const t1 = count("task1_reverse_control", true);
  const t2 = count("task2_reverse_interference", true);
  const t3 = count("task3_stroop_control", true);
  const t4 = count("task4_stroop_interference", true);
  const reverse = t1 > 0 ? Math.round(((t1 - t2) / t1) * 1000) / 10 : "";
  const stroop = t3 > 0 ? Math.round(((t3 - t4) / t3) * 1000) / 10 : "";

  rows.push({
    task: "Reverse Stroop interference rate",
    task_name: "逆ストループ干渉率",
    total_responses: "",
    correct_responses: "",
    accuracy_percent: reverse,
    mean_rt_correct_ms: ""
  });
  rows.push({
    task: "Stroop interference rate",
    task_name: "ストループ干渉率",
    total_responses: "",
    correct_responses: "",
    accuracy_percent: stroop,
    mean_rt_correct_ms: ""
  });

  return rows;
}

function downloadExcel() {
  const wb = XLSX.utils.book_new();
  const summarySheet = XLSX.utils.json_to_sheet(getSummaryRows());
  const rawSheet = XLSX.utils.json_to_sheet(allResponses);
  const practiceSheet = XLSX.utils.json_to_sheet(practiceResponses);

  XLSX.utils.book_append_sheet(wb, summarySheet, "summary");
  XLSX.utils.book_append_sheet(wb, rawSheet, "raw_main");
  XLSX.utils.book_append_sheet(wb, practiceSheet, "raw_practice");

  const now = new Date();
  const pad = n => String(n).padStart(2, "0");
  const timestamp = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
  XLSX.writeFile(wb, `stroop_results_${timestamp}.xlsx`);
}

function showResults() {
  function count(task, correctOnly=false) {
    return allResponses.filter(r =>
      r.task === task && (!correctOnly || r.correct)
    ).length;
  }

  const t1 = count("task1_reverse_control", true);
  const t2 = count("task2_reverse_interference", true);
  const t3 = count("task3_stroop_control", true);
  const t4 = count("task4_stroop_interference", true);

  const reverse = t1 > 0 ? Math.round(((t1 - t2) / t1) * 1000) / 10 : "-";
  const stroop = t3 > 0 ? Math.round(((t3 - t4) / t3) * 1000) / 10 : "-";

  document.body.innerHTML = `
    <div style="font-size:24px; text-align:center; padding:20px;">
      <h2>結果</h2>
      <button class="download-btn" onclick="downloadExcel()">Excelで結果をダウンロード</button>

      <h3>逆ストループ</h3>
      <p>Task 1 正答数：${t1} / ${count("task1_reverse_control")}</p>
      <p>Task 2 正答数：${t2} / ${count("task2_reverse_interference")}</p>
      <p><b>逆ストループ干渉率：</b>${reverse}%</p>

      <hr>

      <h3>ストループ</h3>
      <p>Task 3 正答数：${t3} / ${count("task3_stroop_control")}</p>
      <p>Task 4 正答数：${t4} / ${count("task4_stroop_interference")}</p>
      <p><b>ストループ干渉率：</b>${stroop}%</p>

      <hr>
      <h3>詳細データ</h3>
      <pre style="text-align:left; font-size:14px;">${JSON.stringify(allResponses, null, 2)}</pre>
    </div>
  `;
}

jsPsych.run([
  startInstruction,

  makeTaskInstruction(
    "Task 1：練習",
    "黒のインクで表示される「文字の意味」に対応するボタンを押してください。",
    true
  ),
  makePracticeTask(
    "task1_reverse_control",
    "Task 1",
    "黒のインクで表示される「文字の意味」に対応するボタンを押してください。",
    "task1",
    task1Stimuli
  ),
  makeTaskInstruction(
    "Task 1",
    "黒のインクで表示される「文字の意味」に対応するボタンを押してください。"
  ),
  makeTask(
    "task1_reverse_control",
    "Task 1",
    "黒のインクで表示される「文字の意味」に対応するボタンを押してください。",
    "task1",
    task1Stimuli
  ),

  makeTaskInstruction(
    "Task 2：練習",
    "文字のインクの色に惑わされず、「文字の意味」に対応するボタンを押してください。",
    true
  ),
  makePracticeTask(
    "task2_reverse_interference",
    "Task 2",
    "文字のインクの色に惑わされず、「文字の意味」に対応するボタンを押してください。",
    "task2",
    task2Stimuli
  ),
  makeTaskInstruction(
    "Task 2",
    "文字のインクの色に惑わされず、「文字の意味」に対応するボタンを押してください。"
  ),
  makeTask(
    "task2_reverse_interference",
    "Task 2",
    "文字のインクの色に惑わされず、「文字の意味」に対応するボタンを押してください。",
    "task2",
    task2Stimuli
  ),

  makeTaskInstruction(
    "Task 3：練習",
    "文字の「インクの色」に対応するボタンを押してください。",
    true
  ),
  makePracticeTask(
    "task3_stroop_control",
    "Task 3",
    "文字の「インクの色」に対応するボタンを押してください。",
    "task3",
    task3Stimuli
  ),
  makeTaskInstruction(
    "Task 3",
    "文字の「インクの色」に対応するボタンを押してください。"
  ),
  makeTask(
    "task3_stroop_control",
    "Task 3",
    "文字の「インクの色」に対応するボタンを押してください。",
    "task3",
    task3Stimuli
  ),

  makeTaskInstruction(
    "Task 4：練習",
    "文字の意味に惑わされず、文字の「インクの色」に対応するボタンを押してください。",
    true
  ),
  makePracticeTask(
    "task4_stroop_interference",
    "Task 4",
    "文字の意味に惑わされず、文字の「インクの色」に対応するボタンを押してください。",
    "task4",
    task4Stimuli
  ),
  makeTaskInstruction(
    "Task 4",
    "文字の意味に惑わされず、文字の「インクの色」に対応するボタンを押してください。"
  ),
  makeTask(
    "task4_stroop_interference",
    "Task 4",
    "文字の意味に惑わされず、文字の「インクの色」に対応するボタンを押してください。",
    "task4",
    task4Stimuli
  )
]);

</script>
</html>
